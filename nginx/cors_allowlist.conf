# CORS allowlist — map entries for $cors_origin, included by nginx.conf.
#
# Regenerated at container start from CORS_ALLOWED_ORIGINS by
# /docker-entrypoint.d/20-cors-allowlist.sh. Edit that env var, not this file.
#
# Anything not listed here gets an empty $cors_origin, and nginx omits an
# add_header whose value is empty — so unknown origins receive no CORS headers
# at all. Previously this config reflected $http_origin back with
# Allow-Credentials: true, which let *any* site make credentialed API calls.
#
# A same-origin deployment (the usual case: nginx serves both the SPA and /api/)
# needs no entries here — the browser never sends a cross-origin request.

# Local development servers, where the Vite dev server is on a different port.
"~^http://localhost(:[0-9]+)?$"  $http_origin;
"~^http://127\.0\.0\.1(:[0-9]+)?$"  $http_origin;
