name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # *** THE pytest JOB WAS REMOVED FROM CI ON 2026-09-09. IT RUNS LOCALLY. ***
  #
  # Owner instruction: "i want our pytest running locally so our merge to main via PR
  # dont need it... when you or i push to main or via PR we dont need to run them
  # online." The backend suite is ~8 minutes and it was the only thing a PR ever waited
  # on.
  #
  # *** THIS IS ONLY SAFE BECAUSE THE LOCAL GATE NOW RUNS BOTH INTERPRETERS. ***
  # CI was the ONLY place Python 3.11 ever ran — `preflight.sh quick`, which the
  # pre-push hook used, is 3.12 only. Deleting this job without that change would have
  # silently dropped 3.11 everywhere, and 3.11 is not a formality: the workflow's own
  # comment said self-hosters "will not all be on the same interpreter as the shipped
  # image". `scripts/preflight.sh` now runs 3.11 and 3.12 IN PARALLEL, the way this job
  # did, so the full local gate costs about what CI cost.
  #
  # THE REQUIRED STATUS CHECKS WERE UPDATED IN THE SAME CHANGE. A required check whose
  # job no longer exists can never report, and every PR blocks forever on
  # "N of N required status checks are expected" — which is exactly the refusal this
  # repo hit on 2026-09-09 when a branch went BEHIND.
  web-ui:
    name: web-ui (typecheck + vitest)
    runs-on: ubuntu-latest
    # *** THIS JOB DID NOT EXIST UNTIL 2026-08-07, AND THAT IS THE POINT. ***
    #
    # CI ran pytest and nothing else, so the ~180 vitest tests and the typecheck
    # only ever ran when somebody remembered to run them locally. Every web-ui
    # gate this project has built — the typecheck gate (D-45), the className
    # resolution sweep (D-60), apiErrorPrecedence, uiHonesty, the page-shell
    # pins, and now informationArchitecture — was unenforced on every PR.
    #
    # A gate that runs only when remembered is not a gate. The image build runs
    # `vite build`, which strips types WITHOUT checking them, so nothing else
    # was covering this either.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22, not 20, and NOT merely because 20 is deprecated. The responsive walk
          # drives CDP over a global WebSocket, which landed in Node 21/22 — on Node 20
          # it dies with a bare `ReferenceError: WebSocket is not defined`. That is how
          # this pinned version came to matter: the gate was verified on Node 22 locally
          # and the runner was pinned to 20, so "no new dependency" was true on one
          # machine and false on the other.
          node-version: '22'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        working-directory: web-ui
        run: npm ci

      - name: Typecheck
        working-directory: web-ui
        # `npm run typecheck` is `tsc -b`, NOT `tsc --noEmit`. tsconfig.json is
        # solution-style (`files: []` + project references) and `--noEmit` does
        # not follow references, so it compiles ZERO files and always exits 0 —
        # that was live for five sessions. AUDIT D-45; typecheckGate.test.ts
        # fails if the script ever reverts.
        run: npm run typecheck

      - name: Tests
        working-directory: web-ui
        # There is deliberately no `test` script in web-ui's package.json.
        #
        # One test in informationArchitecture.test.ts SKIPS here and is meant to:
        # it compares web's nav vocabulary with mobile's, and mobile lives in the
        # outer repo which this checkout does not contain. The skip is explicit,
        # a companion assertion reports whether it ran, and the web-side pin is
        # self-contained so nothing here silently inspects nothing.
        run: npx vitest run

      - name: Contrast tree-walk (rendered page, real browser)
        working-directory: web-ui
        # *** THE HALF OF THE CONTRAST GATE THAT tokenContrast.test.ts CANNOT DO. ***
        #
        # That file validates the PALETTE — it proves the declared token pairs
        # clear AA. It cannot see USAGE: `color: var(--kt-green)` on a wash-backed
        # element is 4.39:1, a real AA failure, and it stays green because
        # green-on-wash is classified an 'object' and 4.39 clears the 3.0 non-text
        # floor.
        #
        # This walks a RENDERED page and resolves every element's own colour
        # against its ACTUAL COMPUTED BACKGROUND, climbing ancestors for
        # transparent ones — enumerated from the tree, never from a list of pairs
        # somebody thought of, which is D-59 in another costume.
        #
        # IT NEEDS A REAL ENGINE. jsdom applies no external stylesheet, so
        # getComputedStyle there resolves initial values and would pass on
        # everything — which is why this is a separate step and not a vitest test.
        # `run.mjs` EXITS 2 IF NO CHROME IS FOUND rather than skipping: a contrast
        # gate that quietly does nothing looks exactly like one that passes, and
        # that shape has already been shipped four times in this repo.
        #
        # It gates on a BASELINE RATCHET rather than on zero. The page still
        # carries failures from the app's existing palette, and the plan puts a
        # live-app contrast sweep explicitly out of scope — so demanding zero
        # would fail on day one and get switched off. Any pair NOT in
        # baseline.json fails; pairs that disappear are reported so the baseline
        # can be tightened.
        # BOTH captures, then ONE walk over everything captured. The walk sweeps
        # the directory rather than naming a file, so adding a page to
        # `capture-pages.walk.tsx` is enough — nobody has to remember to add it
        # here as well. It walked Transactions alone for its first day, which is
        # exactly how Dashboard and Budgets shipped carrying five AA failures
        # each while the gate reported green: "unmeasured" reading as "clean".
        run: |
          npx vitest run --config scripts/contrast-walk/vitest.walk.config.ts
          WALK_CAPTURE=scripts/contrast-walk/capture-pages.walk.tsx \
            npx vitest run --config scripts/contrast-walk/vitest.walk.config.ts
          node scripts/contrast-walk/run.mjs
          # The SAME captures, walked again for horizontal overflow at 1440/1024/768/390
          # in both themes. Also needs a real engine, and for a second reason: it drives
          # CDP Emulation.setDeviceMetricsOverride because `--window-size` CANNOT render
          # a phone — Chrome clamps its window to 500px SILENTLY, so a width sweep built
          # the naive way reports "390: pass" having never rendered under 500. Exits 2 if
          # no Chrome is found, and asserts the emulated width actually took.
          #
          # It has NO baseline.json, and that means the bar is ZERO, not that it is off.
          node scripts/responsive-walk/run.mjs

      - name: Modal overflow walk (dialogs, rendered, real browser)
        working-directory: web-ui
        # *** THE TWO WALKS ABOVE ARE STRUCTURALLY BLIND TO ALMOST EVERY DIALOG IN
        # THE APP, AND NOT BECAUSE NOBODY LISTED THEM. ***
        #
        # They sweep `contrast-walk/captured/`, which is written from RTL's
        # `container.innerHTML` — and `Modal.tsx` and `SlidePanel.tsx` both
        # `createPortal(..., document.body)`, so their markup is a SIBLING of that
        # container. Measured: dialog in document true, dialog in container FALSE.
        # Adding those modals to the page capture would have produced nothing.
        # Accounts, Transactions, Budgets, Groups, GroupDetail, Investments,
        # Categories and Rules all reach users through one of those two shells.
        #
        # The one modal the walks do see — MyCards' Add-Card dialog, which
        # `MUST_SCROLL_AT_390` asserts on — is visible only because it happens to be
        # written inline. The coverage that existed was an accident of one
        # component's implementation.
        #
        # Separate from the responsive walk on purpose: that one measures against
        # `.main-content`, and a `position: fixed` overlay neither sits in it nor
        # contributes to `documentElement.scrollWidth`, so its document check is
        # blind to a modal BY CONSTRUCTION. This measures against the viewport, and
        # it asserts WHICH element scrolls — a modal body computes `overflow-x: auto`
        # as a side effect of its own `overflow-y`, so "something scrolled" is
        # satisfied by the user dragging the whole dialog sideways.
        #
        # Bar is ZERO and there is no baseline file, deliberately.
        run: |
          WALK_CAPTURE=scripts/modal-walk/capture-modals.walk.tsx \
            npx vitest run --config scripts/contrast-walk/vitest.walk.config.ts
          node scripts/modal-walk/run.mjs
