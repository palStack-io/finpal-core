name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.12 is what production runs: the Dockerfile is built on
          # python:3.12-slim. This leg is the one that matters for "will it work
          # when deployed".
          #
          # This used to be a 3.8 leg, because the image was built on ubuntu:20.04
          # whose `python3` is 3.8.10. That base is gone and 3.8 reached end of
          # life in October 2024, so testing it no longer described anything we
          # ship — and supporting it forced yfinance and multitasking to stay on
          # releases predating Python 3.9.
          - python-version: '3.12'
            runner: ubuntu-latest
          # A second supported version, so a 3.12-only assumption cannot creep in
          # unnoticed. finpal_core is self-hosted, and self-hosters will not all
          # be on the same interpreter as the shipped image.
          - python-version: '3.11'
            runner: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run test suite
        # The suite is self-contained: tests/conftest.py points SQLAlchemy at
        # sqlite:///:memory: and builds the schema itself, so no database
        # service is needed. Secrets are stubbed in conftest.
        run: python -m pytest

  web-ui:
    name: web-ui (typecheck + vitest)
    runs-on: ubuntu-latest
    # *** THIS JOB DID NOT EXIST UNTIL 2026-08-07, AND THAT IS THE POINT. ***
    #
    # CI ran pytest and nothing else, so the ~180 vitest tests and the typecheck
    # only ever ran when somebody remembered to run them locally. Every web-ui
    # gate this project has built — the typecheck gate (D-45), the className
    # resolution sweep (D-60), apiErrorPrecedence, uiHonesty, the page-shell
    # pins, and now informationArchitecture — was unenforced on every PR.
    #
    # A gate that runs only when remembered is not a gate. The image build runs
    # `vite build`, which strips types WITHOUT checking them, so nothing else
    # was covering this either.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Install dependencies
        working-directory: web-ui
        run: npm ci

      - name: Typecheck
        working-directory: web-ui
        # `npm run typecheck` is `tsc -b`, NOT `tsc --noEmit`. tsconfig.json is
        # solution-style (`files: []` + project references) and `--noEmit` does
        # not follow references, so it compiles ZERO files and always exits 0 —
        # that was live for five sessions. AUDIT D-45; typecheckGate.test.ts
        # fails if the script ever reverts.
        run: npm run typecheck

      - name: Tests
        working-directory: web-ui
        # There is deliberately no `test` script in web-ui's package.json.
        #
        # One test in informationArchitecture.test.ts SKIPS here and is meant to:
        # it compares web's nav vocabulary with mobile's, and mobile lives in the
        # outer repo which this checkout does not contain. The skip is explicit,
        # a companion assertion reports whether it ran, and the web-side pin is
        # self-contained so nothing here silently inspects nothing.
        run: npx vitest run

      - name: Contrast tree-walk (rendered page, real browser)
        working-directory: web-ui
        # *** THE HALF OF THE CONTRAST GATE THAT tokenContrast.test.ts CANNOT DO. ***
        #
        # That file validates the PALETTE — it proves the declared token pairs
        # clear AA. It cannot see USAGE: `color: var(--kt-green)` on a wash-backed
        # element is 4.39:1, a real AA failure, and it stays green because
        # green-on-wash is classified an 'object' and 4.39 clears the 3.0 non-text
        # floor.
        #
        # This walks a RENDERED page and resolves every element's own colour
        # against its ACTUAL COMPUTED BACKGROUND, climbing ancestors for
        # transparent ones — enumerated from the tree, never from a list of pairs
        # somebody thought of, which is D-59 in another costume.
        #
        # IT NEEDS A REAL ENGINE. jsdom applies no external stylesheet, so
        # getComputedStyle there resolves initial values and would pass on
        # everything — which is why this is a separate step and not a vitest test.
        # `run.mjs` EXITS 2 IF NO CHROME IS FOUND rather than skipping: a contrast
        # gate that quietly does nothing looks exactly like one that passes, and
        # that shape has already been shipped four times in this repo.
        #
        # It gates on a BASELINE RATCHET rather than on zero. The page still
        # carries failures from the app's existing palette, and the plan puts a
        # live-app contrast sweep explicitly out of scope — so demanding zero
        # would fail on day one and get switched off. Any pair NOT in
        # baseline.json fails; pairs that disappear are reported so the baseline
        # can be tightened.
        # BOTH captures, then ONE walk over everything captured. The walk sweeps
        # the directory rather than naming a file, so adding a page to
        # `capture-pages.walk.tsx` is enough — nobody has to remember to add it
        # here as well. It walked Transactions alone for its first day, which is
        # exactly how Dashboard and Budgets shipped carrying five AA failures
        # each while the gate reported green: "unmeasured" reading as "clean".
        run: |
          npx vitest run --config scripts/contrast-walk/vitest.walk.config.ts
          WALK_CAPTURE=scripts/contrast-walk/capture-pages.walk.tsx \
            npx vitest run --config scripts/contrast-walk/vitest.walk.config.ts
          node scripts/contrast-walk/run.mjs
