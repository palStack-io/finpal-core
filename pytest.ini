[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# *** A PER-TEST WALL CLOCK, ADDED 2026-09-10 ON THE OWNER'S INSTRUCTION. ***
# Nothing in this suite had one, so a test that deadlocks -- an APScheduler job
# sharing the request's StaticPool connection (D-61), a live HTTP call nobody
# mocked, a `waitFor` with no resolution -- hangs the whole run until a human
# notices. That happened twice on 2026-09-10 and cost ~30 minutes of a session
# waiting on a gate that was never going to answer.
#
# `thread` method, not `signal`: `signal` only fires on the main thread and this
# suite runs Flask test clients and a scheduler, so a hang off the main thread --
# the likely kind -- would be invisible to it.
#
# 60s is roughly 40x the slowest honest test here. A test that trips this is
# almost certainly stuck, not slow; if one is legitimately slower, mark it with
# @pytest.mark.timeout(N) rather than raising the global.
addopts = -v --tb=short --timeout=60 --timeout-method=thread
filterwarnings =
    ignore::DeprecationWarning
    ignore::sqlalchemy.exc.SAWarning
