services:
  # ===================================
  # PostgreSQL Database
  # ===================================
  db:
    image: postgres:15-alpine
    container_name: finpal-db
    environment:
      POSTGRES_DB: ${DB_NAME:-finpal}
      POSTGRES_USER: ${DB_USER:-finpal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finpal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-finpal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================
  # Backend API
  # ===================================
  backend:
    image: ghcr.io/palstack-io/finpal-backend:latest
    container_name: finpal-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database
      - SQLALCHEMY_DATABASE_URI=postgresql://${DB_USER:-finpal}:${DB_PASSWORD}@db:5432/${DB_NAME:-finpal}

      # Flask
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - DEBUG=False
      - DEVELOPMENT_MODE=False
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # Encryption (for sensitive fields — generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}

      # Application
      - DISABLE_SIGNUPS=${DISABLE_SIGNUPS:-False}

      # Feature Flags
      - INVESTMENT_TRACKING_ENABLED=${INVESTMENT_TRACKING_ENABLED:-true}
      - SIMPLEFIN_ENABLED=${SIMPLEFIN_ENABLED:-true}
      - FMP_API_KEY=${FMP_API_KEY:-}
      - POINTSPAL_ENABLED=${POINTSPAL_ENABLED:-false}
      - POINTSPAL_SYNC_INTERVAL_HOURS=${POINTSPAL_SYNC_INTERVAL_HOURS:-24}

      # Email (optional - for password reset)
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - MAIL_SERVER=${MAIL_SERVER:-smtp.gmail.com}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-True}
      - MAIL_USE_SSL=${MAIL_USE_SSL:-False}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_DEFAULT_SENDER=${MAIL_DEFAULT_SENDER:-}

      # OIDC Single Sign-On (optional)
      - OIDC_ENABLED=${OIDC_ENABLED:-false}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_DISCOVERY_URL=${OIDC_DISCOVERY_URL:-}
      - OIDC_PROVIDER_NAME=${OIDC_PROVIDER_NAME:-SSO}
      - OIDC_LOGOUT_URI=${OIDC_LOGOUT_URI:-}
      - APP_URL=${APP_URL:-http://localhost}
      - LOCAL_LOGIN_DISABLE=${LOCAL_LOGIN_DISABLE:-False}

    networks:
      - finpal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===================================
  # Web UI
  # ===================================
  web:
    image: ghcr.io/palstack-io/finpal-web:latest
    container_name: finpal-web
    depends_on:
      - backend
    networks:
      - finpal-network
    restart: unless-stopped

  # ===================================
  # Nginx Reverse Proxy
  # ===================================
  nginx:
    image: ghcr.io/palstack-io/finpal-nginx:latest
    container_name: finpal-nginx
    depends_on:
      - backend
      - web
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - finpal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ===================================
  # Backup — Postgres → local + remote
  # ===================================
  backup:
    image: ghcr.io/palstack-io/finpal-backup:latest
    container_name: finpal-backup
    environment:
      # ── Postgres connection ──────────────────
      - POSTGRES_HOST=db
      - POSTGRES_USER=${DB_USER:-finpal}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      # ── Schedule (cron expression) ───────────
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 3 * * *}
      # ── Local retention ──────────────────────
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      # ── Remote bucket name ───────────────────
      - BACKUP_REMOTE_BUCKET=${BACKUP_REMOTE_BUCKET:-}
      # ── rclone remote — Backblaze B2 ─────────
      #    Set RCLONE_CONFIG_REMOTE_TYPE=b2 to use B2
      - RCLONE_CONFIG_REMOTE_TYPE=${RCLONE_CONFIG_REMOTE_TYPE:-}
      - RCLONE_CONFIG_REMOTE_ACCOUNT=${RCLONE_CONFIG_REMOTE_ACCOUNT:-}
      - RCLONE_CONFIG_REMOTE_KEY=${RCLONE_CONFIG_REMOTE_KEY:-}
      # ── rclone remote — Cloudflare R2 / S3 ───
      #    Set RCLONE_CONFIG_REMOTE_TYPE=s3 to use R2/S3
      - RCLONE_CONFIG_REMOTE_PROVIDER=${RCLONE_CONFIG_REMOTE_PROVIDER:-}
      - RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID=${RCLONE_CONFIG_REMOTE_ACCESS_KEY_ID:-}
      - RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY=${RCLONE_CONFIG_REMOTE_SECRET_ACCESS_KEY:-}
      - RCLONE_CONFIG_REMOTE_ENDPOINT=${RCLONE_CONFIG_REMOTE_ENDPOINT:-}
      - RCLONE_CONFIG_REMOTE_REGION=${RCLONE_CONFIG_REMOTE_REGION:-auto}
      # ── Optional monitoring ping ──────────────
      - BACKUP_HEALTHCHECK_URL=${BACKUP_HEALTHCHECK_URL:-}
    volumes:
      - ${BACKUP_PATH:-./backups}:/backups
    networks:
      - finpal-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  finpal-network:
    driver: bridge
